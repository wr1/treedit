# Lint and format on every commit. Install once after clone:
#   uv sync && uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in uv.lock (uv run ruff --version).
    rev: v0.16.10
    hooks:
      # Linter first (with autofix), then formatter. ruff-pre-commit requires this order.
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
