[project]
name = "treedit"
version = "0.1.0"
description = "Review a directory tree with an agent: annotate files, leave feedback, edit in a browser or native window"
authors = [{ name = "wr1", email = "8971152+wr1@users.noreply.github.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/treedit/vendor/LICENSE-xterm.txt"]
keywords = ["editor", "annotation", "code-review", "agent", "claude", "cli", "tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Text Editors",
]
dependencies = [
    "treeparse>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/wr1/treedit"
Repository = "https://github.com/wr1/treedit"
Issues = "https://github.com/wr1/treedit/issues"

[project.scripts]
treedit = "treedit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treedit"]

[tool.hatch.build.targets.sdist]
include = ["src/treedit", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SKILL.md", "Makefile", "app/src", "app/build.rs",
           "app/Cargo.toml", "app/Cargo.lock", "app/tauri.conf.json", "app/icons", "app/dist",
           "app/treedit-app.desktop"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pinned: ruff 0.16 widened the default set

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["treedit"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.uv.sources]
treeparse = { git = "https://github.com/wr1/treeparse.git", rev = "3e1d2990eb629cb4d3d0f602ae45178672805c87" }
